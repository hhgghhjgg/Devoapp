apply plugin: "com.android.application"

def enableHermes = true

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.myapp"

    defaultConfig {
        applicationId "com.myapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        pickFirst '**/libjsc.so'
        pickFirst '**/libhermes.so'
        pickFirst '**/libfbjni.so'
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libreactnativejni.so'
        pickFirst '**/libjsi.so'
        pickFirst '**/libreact_render_core.so'
        pickFirst '**/libreact_render_graphics.so'
        pickFirst '**/libreact_render_mapbuffer.so'
        pickFirst '**/libreact_render_componentregistry.so'
        pickFirst '**/libyoga.so'
        pickFirst '**/libfolly_json.so'
        pickFirst '**/libfolly_runtime.so'
        pickFirst '**/libglog.so'
        pickFirst '**/libreact_debug.so'
        pickFirst '**/libreact_nativemodule_core.so'
        pickFirst '**/libreact_performance_timeline.so'
        pickFirst '**/libreact_render_scheduler.so'
        pickFirst '**/libreact_render_uimanager.so'
        pickFirst '**/libreact_utils.so'
        pickFirst '**/librrc_view.so'
        pickFirst '**/libruntimeexecutor.so'
        pickFirst '**/libturbomodulejsijni.so'
        pickFirst '**/libreactnative.so'
    }
}

dependencies {
    implementation("com.facebook.react:react-android:${rootProject.ext.reactNativeVersion}")

    if (enableHermes) {
        implementation("com.facebook.react:hermes-android:${rootProject.ext.reactNativeVersion}")
    }

    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("com.google.android.material:material:1.11.0")
}
