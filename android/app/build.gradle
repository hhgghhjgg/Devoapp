apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

import com.android.build.OutputFile

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'
def enableHermes = true

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.myapp"

    defaultConfig {
        applicationId "com.myapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('release.keystore')
            storePassword System.getenv("RELEASE_STORE_PASSWORD") ?: "android"
            keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "my-key-alias"
            keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            shrinkResources false
        }
    }

    packagingOptions {
        pickFirst '**/libjsc.so'
        pickFirst '**/libhermes.so'
        pickFirst '**/libfbjni.so'
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libreactnativejni.so'
        pickFirst '**/libjsi.so'
        pickFirst '**/libreact_render_core.so'
        pickFirst '**/libreact_render_graphics.so'
        pickFirst '**/libreact_render_mapbuffer.so'
        pickFirst '**/libreact_render_componentregistry.so'
        pickFirst '**/libyoga.so'
        pickFirst '**/libfolly_json.so'
        pickFirst '**/libfolly_runtime.so'
        pickFirst '**/libglog.so'
        pickFirst '**/libreact_debug.so'
        pickFirst '**/libreact_nativemodule_core.so'
        pickFirst '**/libreact_performance_timeline.so'
        pickFirst '**/libreact_render_scheduler.so'
        pickFirst '**/libreact_render_uimanager.so'
        pickFirst '**/libreact_utils.so'
        pickFirst '**/librrc_view.so'
        pickFirst '**/libruntimeexecutor.so'
        pickFirst '**/libturbomodulejsijni.so'
        pickFirst '**/libreactnative.so'
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (enableHermes) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
