pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://www.jitpack.io' }
    }
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'MyApp'

include ':app'

includeBuild('../node_modules/@react-native/gradle-plugin')

// Include React Native from node_modules
include ':ReactAndroid'
project(':ReactAndroid').projectDir = file('../node_modules/react-native/ReactAndroid')

include ':ReactAndroid:hermes-engine'
project(':ReactAndroid:hermes-engine').projectDir = file('../node_modules/react-native/ReactAndroid/hermes-engine')

// Include React Native from source (for development)
include ':ReactAndroid:flipper-integration'
project(':ReactAndroid:flipper-integration').projectDir = file('../node_modules/react-native/ReactAndroid/flipper-integration')

