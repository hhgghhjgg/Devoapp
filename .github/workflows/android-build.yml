name: Android Build APK

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'both'
        type: choice
        options:
          - debug
          - release
          - both
      clear_cache:
        description: 'Clear All Caches'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.6'
  APP_NAME: 'MyApp'
  PACKAGE_NAME: 'com.myapp'
  ANDROID_API_LEVEL: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Display Build Info
        run: |
          echo "=========================================="
          echo "  Build Information"
          echo "=========================================="
          echo "  Repository: ${{ github.repository }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Actor: ${{ github.actor }}"
          echo "  Event: ${{ github.event_name }}"
          echo "  Run ID: ${{ github.run_id }}"
          echo "  Run Number: ${{ github.run_number }}"
          echo "  Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="

      - name: Display System Info
        run: |
          echo "=========================================="
          echo "  System Information"
          echo "=========================================="
          echo "  OS: $(uname -a)"
          echo "  CPU: $(nproc) cores"
          echo "  Memory: $(free -h | grep Mem | awk '{print $2}')"
          echo "  Disk: $(df -h / | tail -1 | awk '{print $4}') available"
          echo "=========================================="

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Java Installation
        run: |
          echo "Java Version:"
          java -version
          echo ""
          echo "JAVA_HOME: $JAVA_HOME"
          echo "Java Location: $(which java)"
          echo ""
          echo "Available JDKs:"
          ls -la /usr/lib/jvm/ 2>/dev/null || echo "  No JVMs found in /usr/lib/jvm/"

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Node.js Installation
        run: |
          echo "Node Version: $(node --version)"
          echo "NPM Version: $(npm --version)"
          echo "NPX Version: $(npx --version)"
          echo "Node Location: $(which node)"
          echo "NPM Location: $(which npm)"

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Gradle Installation
        run: |
          echo "Gradle Version:"
          gradle --version
          echo ""
          echo "Gradle Location: $(which gradle)"

      - name: Cache NPM packages
        if: ${{ github.event.inputs.clear_cache != 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            myapp/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Gradle packages
        if: ${{ github.event.inputs.clear_cache != 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK Components
        run: |
          echo "Checking Android SDK..."
          if [ -d "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME: $ANDROID_HOME"
            echo "Installing SDK components..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
              "platform-tools" \
              "platforms;android-${{ env.ANDROID_API_LEVEL }}" \
              "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
              2>/dev/null || true
            echo "SDK components installed!"
          else
            echo "ANDROID_HOME not set, using pre-installed SDK"
            echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          fi

      - name: Install root npm dependencies
        run: |
          echo "=========================================="
          echo "  Installing Root Dependencies"
          echo "=========================================="
          npm install --legacy-peer-deps
          echo ""
          echo "Root dependencies installed!"
          echo "Node modules count: $(ls node_modules 2>/dev/null | wc -l)"
          echo "=========================================="

      - name: Install myapp npm dependencies
        run: |
          echo "=========================================="
          echo "  Installing MyApp Dependencies"
          echo "=========================================="
          cd myapp
          npm install --legacy-peer-deps
          echo ""
          echo "MyApp dependencies installed!"
          echo "Node modules count: $(ls node_modules 2>/dev/null | wc -l)"
          echo "=========================================="

      - name: Verify React Native Installation
        run: |
          echo "=========================================="
          echo "  React Native Verification"
          echo "=========================================="
          echo "React Native CLI:"
          npx react-native --version 2>/dev/null || echo "  CLI not available"
          echo ""
          echo "Checking react-native in root node_modules..."
          if [ -d "node_modules/react-native" ]; then
            echo "  ✓ Found in root"
            echo "  Version: $(cat node_modules/react-native/package.json | grep '"version"' | head -1)"
          else
            echo "  ✗ NOT found in root"
          fi
          echo ""
          echo "Checking react-native in myapp node_modules..."
          if [ -d "myapp/node_modules/react-native" ]; then
            echo "  ✓ Found in myapp"
            echo "  Version: $(cat myapp/node_modules/react-native/package.json | grep '"version"' | head -1)"
          else
            echo "  ✗ NOT found in myapp"
          fi
          echo "=========================================="

      - name: Create assets directory
        run: |
          echo "Creating assets directories..."
          mkdir -p android/app/src/main/assets/myapp
          mkdir -p android/app/src/main/res
          echo "Assets directories created!"
          echo ""
          echo "Directory structure:"
          ls -la android/app/src/main/assets/

      - name: Bundle React Native JS (Production)
        run: |
          echo "=========================================="
          echo "  Bundling React Native JS"
          echo "=========================================="
          echo "Entry file: myapp/index.js"
          echo "Output: android/app/src/main/assets/myapp/index.android.bundle"
          echo "Platform: android"
          echo "Dev: false"
          echo ""
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file myapp/index.js \
            --bundle-output android/app/src/main/assets/myapp/index.android.bundle \
            --assets-dest android/app/src/main/res/ \
            --verbose
          echo ""
          echo "Bundle created successfully!"
          echo "Bundle size: $(du -h android/app/src/main/assets/myapp/index.android.bundle | cut -f1)"
          echo "Bundle lines: $(wc -l < android/app/src/main/assets/myapp/index.android.bundle)"
          echo "=========================================="

      - name: Verify Bundle
        run: |
          echo "Verifying bundle..."
          if [ -f "android/app/src/main/assets/myapp/index.android.bundle" ]; then
            echo "✓ Bundle file exists"
            echo "  Size: $(du -h android/app/src/main/assets/myapp/index.android.bundle | cut -f1)"
            echo "  Lines: $(wc -l < android/app/src/main/assets/myapp/index.android.bundle)"
          else
            echo "✗ Bundle file NOT found!"
            exit 1
          fi

      - name: Generate Gradle Wrapper
        run: |
          echo "=========================================="
          echo "  Generating Gradle Wrapper"
          echo "=========================================="
          cd android
          echo "Current directory: $(pwd)"
          echo "Generating wrapper with Gradle ${{ env.GRADLE_VERSION }}..."
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew
          echo ""
          echo "Gradle Wrapper generated!"
          echo "Files created:"
          ls -la gradlew gradlew.bat gradle/wrapper/ 2>/dev/null || true
          echo ""
          echo "gradle-wrapper.properties:"
          cat gradle/wrapper/gradle-wrapper.properties
          echo "=========================================="

      - name: Verify Gradle Wrapper
        run: |
          echo "Verifying Gradle Wrapper..."
          cd android
          ./gradlew --version
          echo ""
          echo "Gradle Wrapper verified!"

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: |
          echo "=========================================="
          echo "  Building Debug APK"
          echo "=========================================="
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true
          echo ""
          echo "Debug APK built successfully!"
          echo "=========================================="

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        run: |
          echo "=========================================="
          echo "  Building Release APK"
          echo "=========================================="
          cd android
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true
          echo ""
          echo "Release APK built successfully!"
          echo "=========================================="

      - name: Build Release AAB
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: |
          echo "=========================================="
          echo "  Building Release AAB"
          echo "=========================================="
          cd android
          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true
          echo ""
          echo "Release AAB built successfully!"
          echo "=========================================="

      - name: List Build Outputs
        run: |
          echo "=========================================="
          echo "  Build Outputs"
          echo "=========================================="
          echo ""
          echo "Debug APKs:"
          find android/app/build/outputs/apk/debug -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "  No debug APKs found"
          echo ""
          echo "Release APKs:"
          find android/app/build/outputs/apk/release -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "  No release APKs found"
          echo ""
          echo "Release AABs:"
          find android/app/build/outputs/bundle/release -name "*.aab" -exec ls -lh {} \; 2>/dev/null || echo "  No release AABs found"
          echo ""
          echo "All build outputs:"
          find android/app/build/outputs -type f 2>/dev/null || echo "  No outputs found"
          echo "=========================================="

      - name: Upload Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-release-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release AAB
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-release-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build Summary
        if: always()
        run: |
          echo "=========================================="
          echo "  Build Summary"
          echo "=========================================="
          echo "  Status: ${{ job.status }}"
          echo "  Repository: ${{ github.repository }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Actor: ${{ github.actor }}"
          echo "  Event: ${{ github.event_name }}"
          echo "  Run ID: ${{ github.run_id }}"
          echo "  Run Number: ${{ github.run_number }}"
          echo "  Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="
          echo ""
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Build completed successfully!"
          elif [ "${{ job.status }}" == "failure" ]; then
            echo "❌ Build failed!"
          elif [ "${{ job.status }}" == "cancelled" ]; then
            echo "⚠️ Build was cancelled!"
          else
            echo "❓ Build status: ${{ job.status }}"
          fi
          echo "=========================================="
