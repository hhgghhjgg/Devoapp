name: Android Build APK

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'both'
        type: choice
        options:
          - debug
          - release
          - both

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.6'
  APP_NAME: 'MyApp'
  PACKAGE_NAME: 'com.myapp'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Display Build Info
        run: |
          echo "=========================================="
          echo "  Build Information"
          echo "=========================================="
          echo "  Repository: ${{ github.repository }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Actor: ${{ github.actor }}"
          echo "  Event: ${{ github.event_name }}"
          echo "  Run ID: ${{ github.run_id }}"
          echo "  Run Number: ${{ github.run_number }}"
          echo "  Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Java Installation
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Node.js Installation
        run: |
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Gradle Installation
        run: |
          gradle --version

      - name: Cache NPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            myapp/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install root npm dependencies
        run: |
          echo "Installing root dependencies..."
          npm install --legacy-peer-deps
          echo "Done!"

      - name: Install myapp npm dependencies
        run: |
          echo "Installing myapp dependencies..."
          cd myapp
          npm install --legacy-peer-deps
          echo "Done!"

      - name: Create assets directory
        run: |
          mkdir -p android/app/src/main/assets/myapp
          mkdir -p android/app/src/main/res

      - name: Bundle React Native JS (Production)
        run: |
          echo "Bundling React Native JS..."
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file myapp/index.js \
            --bundle-output android/app/src/main/assets/myapp/index.android.bundle \
            --assets-dest android/app/src/main/res/
          echo "Bundle created!"
          echo "Bundle size: $(du -h android/app/src/main/assets/myapp/index.android.bundle | cut -f1)"

      - name: Create debug keystore if not exists
        run: |
          if [ ! -f "android/app/debug.keystore" ]; then
            echo "Creating debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Debug keystore created!"
          else
            echo "Debug keystore already exists!"
          fi

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: |
          echo "=========================================="
          echo "  Building Debug APK"
          echo "=========================================="
          cd android
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          echo "Debug APK built!"

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        run: |
          echo "=========================================="
          echo "  Building Release APK"
          echo "=========================================="
          cd android
          gradle assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          echo "Release APK built!"

      - name: Build Release AAB
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: |
          echo "=========================================="
          echo "  Building Release AAB"
          echo "=========================================="
          cd android
          gradle bundleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          echo "Release AAB built!"

      - name: List Build Outputs
        run: |
          echo "=========================================="
          echo "  Build Outputs"
          echo "=========================================="
          echo ""
          echo "Debug APKs:"
          find android/app/build/outputs/apk/debug -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "  None"
          echo ""
          echo "Release APKs:"
          find android/app/build/outputs/apk/release -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "  None"
          echo ""
          echo "Release AABs:"
          find android/app/build/outputs/bundle/release -name "*.aab" -exec ls -lh {} \; 2>/dev/null || echo "  None"
          echo ""
          echo "=========================================="

      - name: Upload Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-release-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release AAB
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-release-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: warn

      - name: Build Summary
        if: always()
        run: |
          echo "=========================================="
          echo "  Build Summary"
          echo "=========================================="
          echo "  Status: ${{ job.status }}"
          echo "  Repository: ${{ github.repository }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Actor: ${{ github.actor }}"
          echo "  Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Build completed successfully!"
          else
            echo "❌ Build failed!"
          fi
          echo "=========================================="
